services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: vcare
      POSTGRES_PASSWORD: vcare
      POSTGRES_DB: vcare
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  pgdata:
